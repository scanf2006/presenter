<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChurchDisplay Pro - 教会敬拜投屏系统</title>
  <meta name="description" content="专业的教会敬拜投屏软件，支持多屏幕投影、歌词显示、圣经经文和多媒体播放" />
  <style>
    html, body { margin: 0; background: #060816; }
    #boot-splash { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; overflow: hidden; color: #f5f7ff; font-family: "Segoe UI", "Noto Sans SC", sans-serif; background: radial-gradient(1200px 600px at 15% -10%, rgba(76,201,240,.25), transparent 60%), radial-gradient(900px 500px at 85% 110%, rgba(247,37,133,.22), transparent 65%), linear-gradient(135deg, #060816, #101a36); transition: opacity 180ms ease; }
    #boot-splash.boot-splash--leaving { opacity: 0; pointer-events: none; }
    .boot-splash__content { text-align: center; animation: boot-rise 700ms ease-out; }
    .boot-splash__logo { display: inline-grid; place-items: center; width: 92px; height: 92px; margin-bottom: 16px; border-radius: 24px; background: linear-gradient(145deg, #4cc9f0, #5878ff); box-shadow: 0 10px 28px rgba(76,201,240,.28); font-size: 34px; font-weight: 800; letter-spacing: 1px; }
    .boot-splash__title { margin: 0; font-size: 34px; font-weight: 760; }
    .boot-splash__subtitle { margin-top: 8px; color: #9fb0d0; font-size: 13px; letter-spacing: .8px; text-transform: uppercase; }
    .boot-splash__bar { width: 320px; height: 6px; margin: 18px auto 0; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); }
    .boot-splash__bar::before { content: ""; display: block; width: 38%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4cc9f0, #f72585); animation: boot-loading 1.25s ease-in-out infinite; }
    @keyframes boot-rise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes boot-loading { 0% { transform: translateX(-120%); } 50% { transform: translateX(130%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="boot-splash" aria-label="Loading ChurchDisplay Pro">
    <div class="boot-splash__content">
      <div class="boot-splash__logo">CD</div>
      <h1 class="boot-splash__title">ChurchDisplay Pro</h1>
      <div class="boot-splash__subtitle">Preparing your worship session</div>
      <div class="boot-splash__bar" aria-hidden="true"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
