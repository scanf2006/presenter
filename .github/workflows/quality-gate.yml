name: Quality Gate

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit npm Dependencies
        # Blocks a change that introduces a high-severity advisory. Advisories
        # that appear on their own, with no commit, are caught by the scheduled
        # dependency-audit workflow instead.
        run: npm audit --audit-level=high

      - name: Run Commercial Gate
        run: npm run -s commercial:gate

      - name: Lint Frontend
        run: npm run lint

      - name: Test Frontend
        run: npm test

      - name: Test Components
        # Runs in jsdom, separate from the node:test suite above. A broken
        # render had no way of being caught before this existed.
        run: npm run test:components

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Prepare native runtime resources
        run: npm run runtime:prepare

      - name: Compile Rust
        run: cargo +stable check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
