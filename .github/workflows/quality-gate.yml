name: Quality Gate

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Commercial Gate
        run: npm run -s commercial:gate

      - name: Lint Frontend
        run: npm run lint

      - name: Test Frontend
        run: npm test

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Prepare native runtime resources
        run: npm run runtime:prepare

      - name: Compile Rust
        run: cargo +stable check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
