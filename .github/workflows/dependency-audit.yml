name: Dependency Audit

# The full audit, covering the Rust crates as well, which nothing checked
# before. Run it from the Actions tab whenever you want a current picture.
#
# Deliberately not on a schedule. A daily run was tried and dropped: it would
# have reported the same tree over and over, and a routine notification nobody
# needs is how a real one gets ignored.
#
# What still runs by itself:
#   * the quality gate runs `npm audit --audit-level=high` on every push, so a
#     change that introduces a high npm advisory is blocked at the pull request;
#   * this workflow runs on a lock file change, which is when a dependency
#     actually moves. The Rust side has no other automatic trigger.
#
# The gap that leaves is an advisory published against an unchanged tree - the
# zod case (GHSA-mrhx-c7xc-m3w5) was exactly that, and so were the rustls ones.
# Nothing in this repository watches for those any more, so either rely on
# GitHub's Dependabot alerts (Settings > Advanced Security - worth confirming
# they are switched on, since nothing here can check that) or run this workflow
# by hand now and then. It takes a couple of minutes.

on:
  workflow_dispatch:
  push:
    paths:
      - package-lock.json
      - src-tauri/Cargo.lock
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Report every advisory
        # Informational, so the log shows moderate and low findings too.
        run: npm audit || true

      - name: Fail on high or critical
        run: npm audit --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: Install cargo-audit
        # Built from crates.io rather than pulled from a third-party action, to
        # keep the supply chain for a security check as short as possible. The
        # cache above means this compiles only when the cache is cold.
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Report every advisory
        # Informational, so the log shows the unmaintained and unsound warnings
        # too. They are worth reading but not worth blocking on: in a
        # 513-crate tree almost all of them sit in Tauri's transitive
        # dependencies and cannot be acted on from here. The first version of
        # this step used --deny warnings and failed on them, which would have
        # left the audit permanently red — and a check that is always red is a
        # check nobody reads.
        run: cargo audit --file src-tauri/Cargo.lock || true

      - name: Fail on vulnerabilities
        # RUSTSEC-2023-0071 (rsa, Marvin attack) is excluded on purpose, and
        # this is the only exclusion:
        #   * It has no patched release. The fix lands in rsa 0.10, which is
        #     still a release candidate.
        #   * It is a timing sidechannel in PRIVATE key operations. This app
        #     only ever verifies a signature with a public key
        #     (license_store.rs uses RsaPublicKey and nothing else); keys are
        #     signed on the maintainer's machine, not in the product.
        # Revisit when rsa 0.10 is stable, then drop the --ignore so the
        # advisory can block again. Any other vulnerability fails this job.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071
